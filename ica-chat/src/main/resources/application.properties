quarkus.http.port=8080

# ログレベル
quarkus.log.level=INFO
quarkus.log.category."com.ibm.ica".level=DEBUG
quarkus.log.console.enable=true
quarkus.log.console.format=%d{HH:mm:ss} %-5p [%c{1.}] %s%e%n

# LangChain4j - ICA API (OpenAI互換エンドポイント)
# LangChain4j は base-url に /chat/completions を自動付加するため
# ICA の /chat-models/chat/completions に合わせて base-url を設定
quarkus.langchain4j.openai.base-url=https://api.nextgen-beta.ica.ibm.com/ica/v1/chat-models/
# APIキーは環境変数 ICA_API_KEY で設定（起動前に export ICA_API_KEY=your-key）
quarkus.langchain4j.openai.api-key=${ICA_API_KEY}
quarkus.langchain4j.openai.chat-model.model-name=gpt-5.1-chat-gus
quarkus.langchain4j.openai.timeout=120s
quarkus.langchain4j.openai.log-requests=true
quarkus.langchain4j.openai.log-responses=true

# 会話メモリ（直近20メッセージを保持、@ApplicationScoped で永続）
quarkus.langchain4j.openai.chat-model.max-tokens=4096
quarkus.langchain4j.chat-memory.memory-window.max-messages=6
